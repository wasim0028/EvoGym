# Requires metrics-server in the cluster — see devops/README.md.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: evogym-backend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: evogym-backend
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
