apiVersion: batch/v1
kind: Job
metadata:
  name: evogym-backend-migrate
  annotations:
    # Argo CD runs this BEFORE syncing the Deployment, so the schema is always
    # migrated ahead of the new code that depends on it.
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: evogym-backend-migrate
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: evogym-backend:latest
          command: ["npx", "prisma", "migrate", "deploy"]
          envFrom:
            - secretRef:
                name: evogym-backend-secrets
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
