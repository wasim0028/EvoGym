apiVersion: apps/v1
kind: Deployment
metadata:
  name: evogym-frontend
  labels:
    app.kubernetes.io/name: evogym-frontend
    app.kubernetes.io/part-of: evogym
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: evogym-frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: evogym-frontend
        app.kubernetes.io/part-of: evogym
    spec:
      containers:
        - name: frontend
          image: evogym-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
