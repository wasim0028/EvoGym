apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: evogym-backend-dev
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/wasim0028/gym-typescript.git
    targetRevision: develop
    path: devops/kubernetes/backend/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: evogym
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  revisionHistoryLimit: 10
