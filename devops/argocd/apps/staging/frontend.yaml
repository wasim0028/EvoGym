apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: evogym-frontend-staging
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/wasim0028/gym-typescript.git
    targetRevision: staging
    path: devops/kubernetes/frontend/overlays/staging
  destination:
    server: https://kubernetes.default.svc
    namespace: evogym
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  revisionHistoryLimit: 10
