name: Terraform Infrastructure

on:
  push:
    branches: [develop, staging, main]
    paths:
      - "devops/terraform/**"
      - ".github/workflows/terraform.yml"
  pull_request:
    branches: [develop, staging, main]
    paths:
      - "devops/terraform/**"
  workflow_dispatch:

concurrency:
  # Never let two applies touch the same state file at once.
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1
  TF_VERSION: "1.9.5"

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.map.outputs.environment }}
    steps:
      - id: map
        run: |
          BRANCH="${{ github.base_ref || github.ref_name }}"
          case "$BRANCH" in
            develop) echo "environment=dev"     >> "$GITHUB_OUTPUT" ;;
            staging) echo "environment=staging" >> "$GITHUB_OUTPUT" ;;
            main)    echo "environment=prod"    >> "$GITHUB_OUTPUT" ;;
            *)       echo "environment=dev"     >> "$GITHUB_OUTPUT" ;;
          esac

  plan:
    needs: setup
    runs-on: ubuntu-latest
    environment: ${{ needs.setup.outputs.environment }}
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    defaults:
      run:
        working-directory: devops/terraform/environments/${{ needs.setup.outputs.environment }}
    env:
      TF_VAR_razorpay_key_id: ${{ secrets.RAZORPAY_KEY_ID }}
      TF_VAR_razorpay_key_secret: ${{ secrets.RAZORPAY_KEY_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/evogym-${{ needs.setup.outputs.environment }}-terraform-deployer
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - run: terraform fmt -check -recursive
        continue-on-error: true

      - run: terraform init
      - run: terraform validate

      - name: Terraform plan
        id: plan
        run: terraform plan -no-color -out=tfplan
        continue-on-error: true

      - name: Comment plan on the PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const body = `### Terraform plan — \`${{ needs.setup.outputs.environment }}\`
            Outcome: \`${{ steps.plan.outcome }}\`

            Full output is in the [workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}).`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

      - name: Fail if the plan failed
        if: steps.plan.outcome == 'failure'
        run: exit 1

  apply:
    # Applies only on a real push to an environment branch, never on PRs.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: [setup, plan]
    runs-on: ubuntu-latest
    # Add required reviewers to this GitHub Environment (especially "prod")
    # to gate applies behind a manual approval.
    environment: ${{ needs.setup.outputs.environment }}
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: devops/terraform/environments/${{ needs.setup.outputs.environment }}
    env:
      TF_VAR_razorpay_key_id: ${{ secrets.RAZORPAY_KEY_ID }}
      TF_VAR_razorpay_key_secret: ${{ secrets.RAZORPAY_KEY_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/evogym-${{ needs.setup.outputs.environment }}-terraform-deployer
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - run: terraform init
      - run: terraform apply -auto-approve
